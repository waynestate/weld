<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="WELD">
<title>WELD</title>
<!-- WELD, animated: the puddle advances up the seam laying ripples one by one while the open gap ahead of it shrinks. Plays once. prefers-reduced-motion shows the finished mark. -->
<style>
.r0{animation-delay:0.25s}
.r1{animation-delay:0.37s}
.r2{animation-delay:0.49s}
.r3{animation-delay:0.61s}
.r4{animation-delay:0.73s}
.r5{animation-delay:0.85s}
.r6{animation-delay:0.97s}
.r7{animation-delay:1.09s}
.r8{animation-delay:1.21s}
.r9{animation-delay:1.33s}
.r10{animation-delay:1.45s}
.r11{animation-delay:1.57s}
.r12{animation-delay:1.69s}
.r13{animation-delay:1.81s}
.r14{animation-delay:1.93s}
.r15{animation-delay:2.05s}
.r16{animation-delay:2.17s}
.r{animation:wd-r .3s ease-out both;animation-fill-mode:backwards}
.pd{animation:wd-p 1.92s linear 0.25s backwards}
.gp{animation:wd-g 1.92s linear 0.25s backwards}
@keyframes wd-r{from{opacity:0}to{opacity:1}}
@keyframes wd-p{from{transform:translateX(-416px)}to{transform:none}}
@keyframes wd-g{from{x:-94px;width:916px}to{x:322px;width:500px}}
@media (prefers-reduced-motion:reduce){.r,.pd,.gp{animation:none}}
</style>
<defs><clipPath id="t"><rect width="512" height="512" rx="112"/></clipPath></defs>
<g clip-path="url(#t)"><rect width="512" height="512" fill="#0c5449"/><g transform="rotate(-30 256 256)"><rect x="-300" y="256" width="1100" height="500" fill="#073a32"/><rect class="gp" x="322" y="253" width="500" height="6" fill="#021a16"/><g fill="#ffcc33"><circle class="r r0" cx="-120" cy="256" r="56"/><circle class="r r1" cx="-94" cy="256" r="56"/><circle class="r r2" cx="-68" cy="256" r="56"/><circle class="r r3" cx="-42" cy="256" r="56"/><circle class="r r4" cx="-16" cy="256" r="56"/><circle class="r r5" cx="10" cy="256" r="56"/><circle class="r r6" cx="36" cy="256" r="56"/><circle class="r r7" cx="62" cy="256" r="56"/><circle class="r r8" cx="88" cy="256" r="56"/><circle class="r r9" cx="114" cy="256" r="56"/><circle class="r r10" cx="140" cy="256" r="56"/><circle class="r r11" cx="166" cy="256" r="56"/><circle class="r r12" cx="192" cy="256" r="56"/><circle class="r r13" cx="218" cy="256" r="56"/><circle class="r r14" cx="244" cy="256" r="56"/><circle class="r r15" cx="270" cy="256" r="56"/><circle class="r r16" cx="296" cy="256" r="56"/></g><g fill="none" stroke="#d69c00" stroke-width="5" stroke-linecap="round"><path class="r r0" d="M-107.0,201.5 A56,56 0 0 0 -107.0,310.5"/><path class="r r1" d="M-81.0,201.5 A56,56 0 0 0 -81.0,310.5"/><path class="r r2" d="M-55.0,201.5 A56,56 0 0 0 -55.0,310.5"/><path class="r r3" d="M-29.0,201.5 A56,56 0 0 0 -29.0,310.5"/><path class="r r4" d="M-3.0,201.5 A56,56 0 0 0 -3.0,310.5"/><path class="r r5" d="M23.0,201.5 A56,56 0 0 0 23.0,310.5"/><path class="r r6" d="M49.0,201.5 A56,56 0 0 0 49.0,310.5"/><path class="r r7" d="M75.0,201.5 A56,56 0 0 0 75.0,310.5"/><path class="r r8" d="M101.0,201.5 A56,56 0 0 0 101.0,310.5"/><path class="r r9" d="M127.0,201.5 A56,56 0 0 0 127.0,310.5"/><path class="r r10" d="M153.0,201.5 A56,56 0 0 0 153.0,310.5"/><path class="r r11" d="M179.0,201.5 A56,56 0 0 0 179.0,310.5"/><path class="r r12" d="M205.0,201.5 A56,56 0 0 0 205.0,310.5"/><path class="r r13" d="M231.0,201.5 A56,56 0 0 0 231.0,310