<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -26 564 564" role="img" aria-label="WELD">
<title>WELD</title>
<!-- WELD, animated: the ripples lay down one by one along the seam, then the puddle pulses once. Plays once. prefers-reduced-motion shows the finished mark. -->
<style>
.r{animation:wd-r .35s cubic-bezier(.2,.9,.3,1) both;transform-box:fill-box;transform-origin:0 50%}
.r0{animation-delay:0.25s}
.r1{animation-delay:0.41s}
.r2{animation-delay:0.57s}
.r3{animation-delay:0.73s}
.r4{animation-delay:0.89s}
.r5{animation-delay:1.05s}
.r6{animation-delay:1.21s}
.r7{animation-delay:1.37s}
.pd{transform-box:fill-box;transform-origin:center;animation:wd-p 1.6s ease-in-out 1.5s 1 both}
@keyframes wd-r{from{opacity:0;transform:translateX(-26px) scaleX(.6)}to{opacity:1;transform:none}}
@keyframes wd-p{0%,100%{transform:scale(1)}40%{transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.r,.pd{animation:none;opacity:1}}
</style>
<clipPath id="t"><rect width="512" height="512" rx="112"/></clipPath><g clip-path="url(#t)"><g transform="translate(256 256) rotate(-18)"><rect x="-800" y="-800" width="1600" height="800" fill="#0C5449"/><rect x="-800" y="0" width="1600" height="800" fill="#04231E"/><path class="r r0" d="M-240.0 -74Q-124.0 0 -240.0 74Q-204.0 0 -240.0 -74Z" fill="#FFCC33" stroke="#FFCC33" stroke-width="6" stroke-linejoin="round"/><path class="r r1" d="M-190.0 -74Q-74.0 0 -190.0 74Q-154.0 0 -190.0 -74Z" fill="#FFCC33" stroke="#FFCC33" stroke-width="6" stroke-linejoin="round"/><path class="r r2" d="M-140.0 -74Q-24.0 0 -140.0 74Q-104.0 0 -140.0 -74Z" fill="#FFCC33" stroke="#FFCC33" stroke-width="6" stroke-linejoin="round"/><path class="r r3" d="M-90.0 -74Q26.0 0 -90.0 74Q-54.0 0 -90.0 -74Z" fill="#FFCC33" stroke="#FFCC33" stroke-width="6" stroke-linejoin="round"/><path class="r r4" d="M-40.0 -74Q76.0 0 -40.0 74Q-4.0 0 -40.0 -74Z" fill="#FFCC33" stroke="#FFCC33" stroke-width="6" stroke-linejoin="round"/><path class="r r5" d="M10.0 -74Q126.0 0 10.0 74Q46.0 0 10.0 -74Z" fill="#FFCC33" stroke="#FFCC33" stroke-width="6" stroke-linejoin="round"/><path class="r r6" d="M60.0 -74Q176.0 0 60.0 74Q96.0 0 60.0 -74Z" fill="#FFCC33" stroke="#FFCC33" stroke-width="6" stroke-linejoin="round"/><path class="r r7" d="M110.0 -74Q226.0 0 110.0 74Q146.0 0 110.0 -74Z" fill="#FFCC33" stroke="#FFCC33" stroke-width="6" stroke-linejoin="round"/><circle class="pd" cx="214" cy="0" r="28" fill="#FFFFFF"/></g></g>
</svg>
