<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 10 480 456" role="img" aria-label="WELD">
<title>WELD</title>
<!-- WELD, animated: the torch drops in, a spark flashes, and the bead rises across the joint. One flash, plays once. prefers-reduced-motion shows the finished mark. -->
<style>
.pl,.tb{fill:#0C5449}
.tcb{animation:wd-t .7s cubic-bezier(.2,.9,.25,1) both}
.bdr{transform-box:fill-box;transform-origin:50% 100%;animation:wd-b .5s cubic-bezier(.3,.9,.3,1) .7s both}
.sp{transform-box:view-box;transform-origin:256px 300px;animation:wd-sp .6s ease-out .55s both}
@keyframes wd-t{from{transform:translate(70px,-70px);opacity:0}60%{opacity:1}to{transform:none;opacity:1}}
@keyframes wd-b{from{transform:scale(.2,0)}to{transform:none}}
@keyframes wd-sp{0%{transform:scale(0) rotate(-45deg);opacity:1}45%{transform:scale(1.25) rotate(0);opacity:1}100%{transform:scale(0) rotate(30deg);opacity:0}}
@media (prefers-color-scheme:dark){.pl,.tb{fill:#FFFFFF}}
@media (prefers-reduced-motion:reduce){.tcb,.bdr,.sp{animation:none}.sp{opacity:0}}
</style>
<path class="pl" d="M56 346H242V418Q242 436 224 436H92Q56 436 56 400Z"/><path class="pl" d="M270 346H456V400Q456 436 420 436H288Q270 436 270 418Z"/><g class="bdr"><path class="bd" d="M206 346Q214 318 256 318Q298 318 306 346H270V428H242V346Z" fill="#FFCC33"/></g><g class="tcb"><g class="tc" transform="rotate(44 256 292)"><path d="M248 292L240 226H272L264 292Z" fill="#FFCC33"/><rect x="233" y="196" width="46" height="34" rx="6" fill="#FFCC33"/><rect x="241" y="150" width="30" height="50" class="tb"/><path d="M216 150V92Q216 60 248 60H264Q296 60 296 92V150Z" class="tb"/></g></g><g class="sp"><path d="M241.3 298.0L218.8 307.9L243.3 307.8Z" fill="#FF7A1A"/><path d="M244.0 290.3L193.9 284.5L240.8 302.9Z" fill="#FF7A1A"/><path d="M250.6 285.1L193.6 243.8L240.6 296.2Z" fill="#FF7A1A"/><path d="M258.7 284.1L224.5 213.5L243.7 289.6Z" fill="#FF7A1A"/><path d="M264.9 287.1L266.9 222.8L251.0 285.2Z" fill="#FF7A1A"/><path d="M268.1 291.0L284.6 254.2L258.8 285.2Z" fill="#FF7A1A"/><circle cx="256" cy="300" r="15" fill="#FF7A1A"/><circle cx="256" cy="300" r="7" fill="#FFFFFF"/></g>
</svg>
