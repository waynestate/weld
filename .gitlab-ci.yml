# WELD's pipeline, built from the Preflight components on this GitLab.
# Pinned to Preflight 0.3.0. Never use ~latest.
# WELD requires PHP ^8.3, so the test matrix starts at 8.3.
# composer ci is the contract: every check runs from the "ci" script in composer.json.
# Docker Hub images go through the GitLab Dependency Proxy to avoid the anonymous pull limit.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@0.3.0
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
      image: "php:${PHP_VERSION}-cli-trixie"
      # The tests are Pest files, and PHPUnit refuses to load them ("Please run
      # ./vendor/bin/pest instead"). Pest runs the PHPUnit class tests too.
      test_command: vendor/bin/pest
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@0.3.0
    inputs:
      image: "composer:2@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc"
  # The front page deploy layer (ADR-0017): PROCTOR checks deploy/ against CREED's policy.
  # allow_failure: current findings: unbounded dev-main constraints; CI files missing in deploy/.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/proctor@0.3.0
    inputs:
      working_dir: deploy
      proctor_command: vendor/bin/proctor check --format=codequality
      allow_failure: true
      image: "php:8.4-cli-trixie@sha256:9cf851bc2c1b37c3e59dfd677a3c3e56d485af5a47c93f629424bb039eafcb69"

# Every dependency download goes through a cache. The key is fixed per tool,
# not a lock-file hash: Composer's and npm's caches are additive, so a lock
# change downloads only what changed instead of everything.
variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

.composer-cache:
  cache:
    key: composer
    paths: [.cache/composer/]

.npm-cache:
  cache:
    key: npm
    paths: [.cache/npm/]

composer-ci:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci

# PROCTOR measures WELD against the CREED version policy. Warnings are
# allowed; failures block the pipeline.
proctor-root:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer proctor

# The front end: WayneUI is the only component source (BEST_PRACTICES W2).
# ESLint bans the kit's components/ui imports, Prettier and vue-tsc keep the
# code honest, and the build proves WayneUI's CSS and sprite still resolve.
# No PHP here: Ziggy's client comes from npm, the route list is committed.
# Multi-arch image, pinned by its list digest (the runner is arm64).
frontend:
  extends: .npm-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:22.21.1-alpine3.22@sha256:b2358485e3e33bc3a33114d2b1bdb18cdbe4df01bd2b257198eb51beb1f026c5
  script:
    - npm ci --no-audit --no-fund
    - npm run lint
    - npm run format:check
    - npm run typecheck
    - npm run build

# ZIGGY's route list ships inside the Vite bundle, not an inline script, so
# the committed resources/js/ziggy.* must match the routes. Regenerate and
# fail on any diff.
ziggy:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ziggy
    - git diff --exit-code resources/js/ziggy.*

# REGEN GATE: is WELD still Sourdough's Inertia shape? It generates a fresh
# app from Sourdough's main and compares it with WELD by SHA-256. New drift
# blocks the pipeline: fix it, or record it as accepted with --write-baseline.
regen-gate:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - git clone --depth 1 --branch main https://github.com/waynestate/sourdough.git /tmp/sourdough
    - cd /tmp/sourdough && composer install --no-interaction --no-progress --prefer-dist
    - php bin/sourdough new /tmp/regen --inertia --no-advisor --no-input
    - cd "$CI_PROJECT_DIR" && php bin/regen-check.php --generated /tmp/regen
