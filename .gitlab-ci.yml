# WELD's pipeline, built from the Preflight components on this GitLab.
# Pinned to Preflight 0.3.1. Never use ~latest.
# WELD requires PHP ^8.3, so the test matrix starts at 8.3.
# composer ci is the contract: every check runs from the "ci" script in composer.json.
# Docker Hub images go through the GitLab Dependency Proxy to avoid the anonymous pull limit.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@0.3.1
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
      image: "php:${PHP_VERSION}-cli-trixie"
      # The tests are Pest files, and PHPUnit refuses to load them ("Please run
      # ./vendor/bin/pest instead"). Pest runs the PHPUnit class tests too.
      test_command: vendor/bin/pest
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@0.3.1
    inputs:
      image: "composer:2@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc"
  # The front page deploy layer (ADR-0017): PROCTOR checks deploy/ against CREED's policy.
  # allow_failure: current findings: unbounded dev-main constraints; CI files missing in deploy/.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/proctor@0.3.1
    inputs:
      working_dir: deploy
      proctor_command: vendor/bin/proctor check --format=codequality
      allow_failure: true
      image: "php:8.4-cli-trixie@sha256:9cf851bc2c1b37c3e59dfd677a3c3e56d485af5a47c93f629424bb039eafcb69"
  # Accessibility: Preflight's a11y component serves site/ and checks every page with axe-core 4.14.0, light and
  # dark, at 320 and 1280 px, plus WCAG 1.4.10 reflow, at WCAG 2.2 AA. Its Playwright image comes from
  # mcr.microsoft.com, which the Dependency Proxy does not front, so it takes no image_prefix.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/a11y@0.3.1
    inputs:
      site_dir: site
      pages: ["**/*.html"]
      wcag_tags: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"]
  # The same gate over the app's own pages, as Sourdough's Inertia shape runs
  # it: the a11y-pages job saves them into a11y-site/, signed in by SESAME's
  # fake driver. Named a11y-app so it sits beside the site's a11y job. The
  # pages list is the a11y-pages job's A11Y_PATHS: change the two together.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/a11y@0.3.1
    inputs:
      job_name: a11y-app
      site_dir: a11y-site
      pages: ["/", "/dashboard"]
      wcag_tags: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"]
  # The bill of materials: a CycloneDX SBOM of the Composer packages
  # composer.lock installs, dev packages left out, kept as sbom.cdx.json for
  # 30 days. When the next advisory lands, finding out whether WELD has the
  # package is one search instead of one guess.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/sbom@0.3.1
  # Gitleaks reads the checkout and fails on anything shaped like a
  # credential, with the finding redacted in the log and in gitleaks.json.
  # A secret belongs in Settings > CI/CD > Variables, never in a file.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/secret-detection@0.3.1

# Every dependency download goes through a cache. The key is fixed per tool,
# not a lock-file hash: Composer's and npm's caches are additive, so a lock
# change downloads only what changed instead of everything.
# The cache saves even when a job fails (when: always), so a dropped download
# still keeps every package that finished, and the retry fetches only the rest.
variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

.composer-cache:
  cache:
    key: composer
    paths: [.cache/composer/]
    when: always

.npm-cache:
  cache:
    key: npm
    paths: [.cache/npm/]
    when: always

composer-ci:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3@sha256:2cf275428757e5435a667bfc0d038b14520ca02be2b1b70d44a05c8c19e2de48
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci

# Agent tooling stays out of production (BEST_PRACTICES W29): install the way
# a release does (composer install --no-dev, as Squire's release.sh runs it),
# then fail if Laravel Boost came along, and boot artisan to prove the app
# still runs without its dev packages. A boost for laptops, never for servers.
no-dev-install:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3@sha256:2cf275428757e5435a667bfc0d038b14520ca02be2b1b70d44a05c8c19e2de48
  script:
    - composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist
    - test ! -e vendor/laravel/boost || { echo "laravel/boost is in a --no-dev install; keep it in require-dev."; exit 1; }
    - php artisan --version

# PROCTOR measures WELD against the CREED version policy. Warnings are
# allowed; failures block the pipeline.
proctor-root:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3@sha256:2cf275428757e5435a667bfc0d038b14520ca02be2b1b70d44a05c8c19e2de48
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer proctor

# The front end: WayneUI is the only component source (BEST_PRACTICES W2).
# ESLint bans the kit's components/ui imports, Prettier and vue-tsc keep the
# code honest, and the build proves WayneUI's CSS and sprite still resolve.
# No PHP here: Ziggy's client comes from npm, the route list is committed.
# Multi-arch image, pinned by its list digest (the runner is arm64).
frontend:
  extends: .npm-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:22.21.1-alpine3.22@sha256:b2358485e3e33bc3a33114d2b1bdb18cdbe4df01bd2b257198eb51beb1f026c5
  script:
    - npm ci --no-audit --no-fund
    - npm run lint
    - npm run format:check
    - npm run typecheck
    - npm run build
    # The npm half of the bill of materials: every package the install put
    # in node_modules, dev ones too (the build tools make the bundle), as a
    # CycloneDX SBOM from the CycloneDX project's own tool, pinned, with no
    # install scripts. Kept 30 days with the build, which a11y-pages serves.
    - npm exec --yes --ignore-scripts --package=@cyclonedx/cyclonedx-npm@6.0.1 -- cyclonedx-npm --output-format JSON --output-reproducible --validate --output-file sbom-npm.cdx.json
  artifacts:
    expire_in: 30 days
    paths:
      - public/build/
      - sbom-npm.cdx.json

# ZIGGY's route list ships inside the Vite bundle, not an inline script, so
# the committed resources/js/ziggy.* must match the routes. Regenerate and
# fail on any diff.
ziggy:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3@sha256:2cf275428757e5435a667bfc0d038b14520ca02be2b1b70d44a05c8c19e2de48
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ziggy
    - git diff --exit-code resources/js/ziggy.*

# REGEN GATE: is WELD still Sourdough's Inertia shape? It generates a fresh
# app from Sourdough's main and compares it with WELD by SHA-256. New drift
# blocks the pipeline: fix it, or record it as accepted with --write-baseline.
regen-gate:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3@sha256:2cf275428757e5435a667bfc0d038b14520ca02be2b1b70d44a05c8c19e2de48
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - git clone --depth 1 --branch main https://github.com/waynestate/sourdough.git /tmp/sourdough
    - cd /tmp/sourdough && composer install --no-interaction --no-progress --prefer-dist
    - php bin/sourdough new /tmp/regen --inertia --no-advisor --no-input
    - cd "$CI_PROJECT_DIR" && php bin/regen-check.php --generated /tmp/regen

# The pages the a11y-app gate checks, copied from Sourdough's Inertia shape.
# axe-core needs a page in a browser, so this job boots WELD as its first
# run on a desk does (.env from .env.example, a key, an SQLite database,
# php artisan serve), where SESAME signs in with its fake driver, and saves
# each path in A11Y_PATHS, with public/'s static files, into a11y-site/.
# / is the home page signed out; /dashboard goes through /login and comes
# back signed in (in production the CAS server draws its own sign-in page).
# Add each page you build to A11Y_PATHS and to the a11y-app include's pages.
# The gate finds only part of the problems: try each page with a keyboard
# and a screen reader too. The frontend job's build comes along in
# public/build/, so the Vue code runs in the checked page.
a11y-pages:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3@sha256:2cf275428757e5435a667bfc0d038b14520ca02be2b1b70d44a05c8c19e2de48
  needs: [frontend]
  variables:
    A11Y_PATHS: "/ /dashboard"
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - cp .env.example .env
    - php artisan key:generate --no-interaction
    - touch database/database.sqlite
    - php artisan migrate --force --no-interaction
    - php artisan serve --host=127.0.0.1 --port=8080 --no-reload > a11y-server.log 2>&1 &
    # Wait for /up, copy public/'s static files (never its PHP), then save
    # each page in A11Y_PATHS as <path>/index.html and each JSON answer in
    # A11Y_DATA at its own path. One cookie jar for the whole list keeps the
    # fake sign-in from one path to the next, and the server's own origin
    # is cut out of the saved pages so their links work on any port.
    - |
      set -eu
      origin=http://127.0.0.1:8080
      tries=0
      until curl -sf -o /dev/null "$origin/up"; do
        tries=$((tries + 1))
        if [ "$tries" -ge 30 ]; then echo "The app did not answer $origin/up within 30s." >&2; cat a11y-server.log >&2; exit 1; fi
        sleep 1
      done
      rm -rf a11y-site
      mkdir a11y-site
      cp -R public/. a11y-site/
      find a11y-site -name '*.php' -delete
      for path in $A11Y_PATHS; do
        page="a11y-site${path%/}/index.html"
        mkdir -p "$(dirname "$page")"
        curl -fsSL -b .a11y-cookies -c .a11y-cookies -o "$page" "$origin$path"
        sed -i -e "s#$origin/#/#g" -e "s#$origin#/#g" "$page"
        echo "a11y-pages: saved $path"
      done
      for path in ${A11Y_DATA:-}; do
        mkdir -p "$(dirname "a11y-site$path")"
        curl -fsSL -b .a11y-cookies -c .a11y-cookies -H 'Accept: application/json' -o "a11y-site$path" "$origin$path"
        echo "a11y-pages: saved $path"
      done
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - a11y-site/
      - a11y-server.log

a11y-app:
  needs: [a11y-pages]

# Deploy credentials. Citadel deploys WELD with a Quick Update, so the
# pipeline holds no deploy credential and runs no deploy job. When one is
# added (a webhook, a Squire target, a rollout on another platform), it
# extends .deploy:
#
#   deploy-production:
#     extends: .deploy
#     script:
#       - ./deploy.sh
#
# .deploy never runs in a merge request pipeline (that code is not merged
# yet) and runs only on a protected branch or tag, the only refs where
# GitLab hands a job its protected variables. Keep the credential in a
# protected, masked variable in Settings > CI/CD > Variables, never in this
# file or in a component's inputs. A weld this well guarded needs no
# bouncer at the shop door.
.deploy:
  stage: deploy
  resource_group: deploy
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_REF_PROTECTED == "true"
