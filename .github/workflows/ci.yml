# The GitHub mirror's CI. The ci job runs every check from the `ci` script in
# composer.json; the regen gate checks WELD against a fresh Sourdough generation.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*', '*.*.*']

permissions:
  contents: read

jobs:
  ci:
    # pin to a Preflight tag at its first GitHub release
    uses: waynestate/preflight/.github/workflows/php-package.yml@79029cc2300702d0d450c42cc699e12af1b731f8 # 0.1.4
    with:
      php-versions: '["8.3","8.4","8.5"]'
      ci-command: composer ci

  # The front end: WayneUI is the only component source (BEST_PRACTICES W2).
  # ESLint bans the kit's components/ui imports; Prettier, vue-tsc and the
  # build run alongside it. No PHP: Ziggy's client comes from npm.
  frontend:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.21.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  # Is WELD still Sourdough's Inertia shape? Generate a fresh app from
  # Sourdough's main and compare it with WELD by SHA-256. Failures are
  # warnings until .sourdough/regen-baseline.json is filled in.
  regen-gate:
    name: Regen gate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
      - name: Install WELD dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Generate a fresh Sourdough Inertia app
        run: |
          git clone --depth 1 --branch main https://github.com/waynestate/sourdough.git /tmp/sourdough
          cd /tmp/sourdough
          composer install --no-interaction --no-progress --prefer-dist
          php bin/sourdough new /tmp/regen --inertia --no-advisor --no-input
      - name: Gate WELD against the fresh generation
        run: php bin/regen-check.php --generated /tmp/regen
